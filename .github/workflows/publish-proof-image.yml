name: Publish pytest proof image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile.pytest"
      - "docker/pytest-requirements.txt"
      - ".github/workflows/publish-proof-image.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish proof image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile.pytest
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/burhan-pytest:0.10.0
            ghcr.io/${{ github.repository_owner }}/burhan-pytest:latest

      - name: Record immutable digest
        run: echo "ghcr.io/${{ github.repository_owner }}/burhan-pytest@${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
