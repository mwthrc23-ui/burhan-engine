name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -e . pytest==9.1.1 coverage==7.14.3 ruff==0.15.20

      - name: Run lint checks
        run: python -m ruff check src tests

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run -m pytest
          python -m coverage report --include="src/burhan/*" --fail-under=80

      - name: Run benchmark release gate
        run: python -m burhan benchmark --summary-only

      - name: Validate package build
        run: |
          python -m pip install build==1.5.0 twine==7.0.0
          python -m build
          python -m twine check dist/*

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: docker build -t burhan-engine:ci .
