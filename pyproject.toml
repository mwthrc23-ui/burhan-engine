[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "burhan-engine"
version = "0.9.0"
description = "Evidence-first semantic diagnosis for source code"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Custom-Attribution"
license-files = ["LICENSE"]
authors = [{ name = "mwthrc23-ui" }]
dependencies = []
keywords = ["diagnostics", "cli", "analysis", "repair", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/mwthrc23-ui/burhan-engine"
Repository = "https://github.com/mwthrc23-ui/burhan-engine"
Issues = "https://github.com/mwthrc23-ui/burhan-engine/issues"

[project.scripts]
burhan = "burhan.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
