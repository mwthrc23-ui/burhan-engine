[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "burhan-engine"
version = "0.4.0"
description = "Evidence-first semantic diagnosis for source code"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Burhan" }]
dependencies = []

[project.scripts]
burhan = "burhan.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
